name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # vite@7 requires node ^20.19.0 || >=22.12.0 — Node 18 cannot
        # build this repository, so the matrix covers the supported
        # range instead of 18.x/20.x.
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This repo is pnpm-only (pnpm-lock.yaml; no package-lock.json).
      # setup-node hard-fails "Dependencies lock file is not found"
      # when cache:npm is set without a package-lock.json.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup pnpm via corepack
        run: |
          corepack enable
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint --if-present

      - name: Run tests
        run: pnpm test --if-present

      - name: Build
        run: pnpm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          corepack enable
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm audit --audit-level=high || true
