name: Zero-Cost Media Factory

on:
  pull_request:
    paths:
      - ".github/workflows/zero-cost-media-factory.yml"
      - "scripts/build-ngl-media.sh"
      - "scripts/generate-ngl-ad-copy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic media compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate proprietary evidence-bound ad copy
        run: |
          python3 scripts/generate-ngl-ad-copy.py "${{ github.run_number }}" out
          test -s out/ad-copy.json
      - name: Compile progressively populated 12-second animation
        run: |
          chmod +x scripts/build-ngl-media.sh
          TITLE="$(cat out/ad-title.txt)"
          BODY="$(cat out/ad-body.txt)"
          scripts/build-ngl-media.sh "$TITLE" "$BODY" out "${{ github.run_number }}"
      - name: Inspect outputs
        run: |
          test -s out/ngl-short.mp4
          test -s out/receipt.json
          python3 - <<'PY'
          import json
          r=json.load(open("out/receipt.json"))
          a=json.load(open("out/ad-copy.json"))
          assert r["timeline"]["target_seconds"] == 12
          assert 1 <= r["timeline"]["populated_seconds"] <= 12
          assert a["headline"] == r["title"]
          print(json.dumps({"receipt":r,"ad_copy":a}, indent=2))
          PY
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: ngl-media-build
          path: out/
          retention-days: 1
