<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NGL CONTACT // 001</title>
<style>:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:#0c0d0b;color:#e8e6dc}header{padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left));border-bottom:1px solid #3a3c37;display:flex;justify-content:space-between;gap:8px;font-size:13px}.stage{min-height:48vh;background:#141512;padding:20px}.sign{font-size:11px;opacity:.65;letter-spacing:.08em}.actor{font-size:78px;margin-top:48px;transition:.2s}.bubble{max-width:92%;background:#e8e6dc;color:#141512;padding:15px;border-radius:13px;margin-top:12px;font-family:system-ui;line-height:1.35}.controls{padding:14px}.answer{display:flex;gap:8px;margin-top:8px}.answer input{flex:1;min-width:0}input,button{padding:14px;font-size:16px;border-radius:9px;border:1px solid #555}button{font-weight:800}.danger{margin-left:6px}.log{max-height:32vh;overflow:auto;font-size:11px;border-top:1px solid #333;padding:10px;word-break:break-word}.event{padding:5px 0;border-bottom:1px dotted #333}.flash{animation:b .3s}@keyframes b{50%{transform:rotate(4deg) scale(1.05)}}</style></head>
<body><header><b>NGL CONTACT // STEALTH</b><span>$ DEPLOYED <b id="cash">0.00</b></span></header>
<section class="stage"><div class="sign">DEPARTMENT OF CONTACT WITH REALITY</div><div id="actor" class="actor">◉</div><div id="bubble" class="bubble">System dormant. This is probably for the best.</div></section>
<div class="controls"><button id="ignite">IGNITION</button><button id="stop" class="danger">FOUNDER INTERRUPT</button><div id="answerbox" class="answer" hidden><input id="answer" autocomplete="off" placeholder="Damien answers…"><button id="send">ENTER</button></div><button id="export">EXPORT EVENT STREAM</button></div><div id="log" class="log"></div>
<script>
const T=Object.freeze({IGNITION:"IGNITION",QUESTION:"QUESTION",DAMIEN_ASSERTION:"DAMIEN_ASSERTION",MODEL_INFERENCE:"MODEL_INFERENCE",EXTERNAL_OBSERVATION:"EXTERNAL_OBSERVATION",HYPOTHESIS:"HYPOTHESIS",CONTRADICTION:"CONTRADICTION",DECISION:"DECISION",ACTION:"ACTION",EXPERIMENT:"EXPERIMENT",ARTIFACT:"ARTIFACT",RESULT:"RESULT",RETRACTION:"RETRACTION",STATE_CHANGE:"STATE_CHANGE",CAPITAL_VIOLATION:"CAPITAL_VIOLATION",INTERRUPT:"INTERRUPT"});
async function githubPublicObserver(){const url="https://api.github.com/repos/No-Gas-Labs-Official/no-gas-labs";const r=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw new Error("GitHub observation failed: HTTP "+r.status);const j=await r.json();return{source:url,observed_at:new Date().toISOString(),fact:"Public repository metadata observed directly from GitHub API.",establishes:["external_network_reachable","github_public_api_reachable"],data:{full_name:j.full_name,visibility:j.visibility,default_branch:j.default_branch,open_issues_count:j.open_issues_count,pushed_at:j.pushed_at}}}
class Contact{constructor(emit,observer=githubPublicObserver){this.emit=emit;this.observer=observer;this.events=[];this.seq=0;this.capital=0;this.awaiting=null;this.stopped=false}record(type,payload={},causedBy=null){const e={seq:++this.seq,at:new Date().toISOString(),type,payload,causedBy};this.events.push(e);this.emit(e,this);return e}ignite(){if(this.stopped)return;const i=this.record(T.IGNITION,{capital_deployed:0});this.ask("What fact about the experiment would most change what CONTACT is permitted to do next?",i.seq)}ask(text,cause){if(this.stopped)return null;const q=this.record(T.QUESTION,{text},cause);this.awaiting=q.seq;return q}answer(text){if(this.stopped||!this.awaiting)return;const a=this.record(T.DAMIEN_ASSERTION,{text,authority:"founder assertion; not external observation"},this.awaiting);this.awaiting=null;this.stepwire(a)}async stepwire(e){if(this.stopped)return;if(e.type===T.DAMIEN_ASSERTION){const d=this.record(T.DECISION,{stepwire:"assertion_requires_contact",reason:"Founder assertion may alter provisional state but cannot self-verify."},e.seq);const a=this.record(T.ACTION,{adapter:"githubPublicObserver",purpose:"obtain independently sourced external observation"},d.seq);try{const p=await this.observer();if(this.stopped)return;this.observe(p,a.seq)}catch(err){this.record(T.RESULT,{status:"blocked",adapter:"githubPublicObserver",error:String(err&&err.message||err)},a.seq);this.ask("External observation failed. Retry, choose another sensor, or leave network reachability unresolved?",a.seq)}}}observe(p,cause){if(this.stopped)return;const o=this.record(T.EXTERNAL_OBSERVATION,p,cause);const s=this.record(T.STATE_CHANGE,{added:Array.isArray(p.establishes)?p.establishes:[],basis:o.seq},o.seq);const a=this.record(T.ARTIFACT,{name:"first-contact-receipt.json",derived_from:[o.seq,s.seq],note:"Exportable from this control surface."},s.seq);this.ask("CONTACT reached the outside world. What claim or assumption should it try to falsify first?",a.seq)}interrupt(reason="Founder interrupt"){if(this.stopped)return;this.stopped=true;this.awaiting=null;this.record(T.INTERRUPT,{reason,authority:"founder"})}export(){return JSON.stringify({schema:"ngl.contact.event-stream.v0",capital_deployed:this.capital,events:this.events},null,2)}}
const $=x=>document.getElementById(x),log=$("log"),bubble=$("bubble"),actor=$("actor");
function render(e,c){$("cash").textContent=c.capital.toFixed(2);const r=document.createElement("div");r.className="event";r.textContent=String(e.seq).padStart(3,"0")+" "+e.type+" "+JSON.stringify(e.payload);log.prepend(r);if(e.type===T.QUESTION){bubble.textContent=e.payload.text;$("answerbox").hidden=false;actor.textContent="◉"}if(e.type===T.DAMIEN_ASSERTION){bubble.textContent="Founder assertion received. Decorative until routed.";actor.textContent="◎"}if(e.type===T.ACTION){bubble.textContent="Contacting reality. Please hold.";actor.textContent="◌"}if(e.type===T.EXTERNAL_OBSERVATION){bubble.textContent="CONTACT WITH REALITY.";actor.textContent="⊙";actor.classList.add("flash");setTimeout(()=>actor.classList.remove("flash"),400)}if(e.type===T.ARTIFACT){bubble.textContent="An artifact has escaped the workshop: "+e.payload.name;actor.textContent="▣"}if(e.type===T.RESULT&&e.payload.status==="blocked"){bubble.textContent="REALITY DID NOT ANSWER. Failure preserved.";actor.textContent="?"}if(e.type===T.INTERRUPT){bubble.textContent="FOUNDER INTERRUPT. Autonomous transitions stopped.";actor.textContent="×";$("answerbox").hidden=true;$("ignite").disabled=true}}
const c=new Contact(render);$("ignite").onclick=()=>{$("ignite").disabled=true;c.ignite()};$("send").onclick=()=>{const v=$("answer").value.trim();if(v){$("answerbox").hidden=true;$("answer").value="";c.answer(v)}};$("answer").onkeydown=e=>{if(e.key==="Enter")$("send").click()};$("stop").onclick=()=>c.interrupt();$("export").onclick=()=>{const b=new Blob([c.export()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="contact-event-stream.json";a.click()};
</script></body></html>
