<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGL CONTACT</title><style>:root{color-scheme:dark;font-family:ui-monospace,monospace}body{margin:0;background:#0c0d0b;color:#e8e6dc}header{padding:14px;border-bottom:1px solid #444;display:flex;justify-content:space-between}.stage{min-height:52vh;position:relative;background:#141512;padding:20px}.sign{font-size:12px;opacity:.7}.actor{font-size:72px;margin-top:55px}.bubble{max-width:82%;background:#e8e6dc;color:#141512;padding:14px;border-radius:12px;margin-top:10px;font-family:system-ui}.controls{padding:14px}.log{height:25vh;overflow:auto;font-size:11px;border-top:1px solid #333;padding:10px}input{box-sizing:border-box;width:100%;padding:13px;font-size:16px}button{padding:13px;margin-top:8px;font-weight:700}.danger{margin-left:8px}.flash{animation:b .3s}@keyframes b{50%{transform:rotate(4deg) scale(1.05)}}</style></head><body><header><b>NGL CONTACT // STEALTH</b><span>$ DEPLOYED: <b id="cash">0.00</b></span></header><section class="stage"><div class="sign">DEPARTMENT OF CONTACT WITH REALITY</div><div id="actor" class="actor">◉</div><div id="bubble" class="bubble">System dormant. This is probably for the best.</div></section><div class="controls"><button id="ignite">IGNITION</button><button id="stop" class="danger">FOUNDER INTERRUPT</button><div id="answerbox" hidden><input id="answer" placeholder="Damien answers…"><button id="send">ENTER STATE</button></div><button id="export">EXPORT EVENT STREAM</button></div><div id="log" class="log"></div><script src="contact.js"></script><script>const $=x=>document.getElementById(x),log=$("log"),bubble=$("bubble"),actor=$("actor");function render(e,c){$("cash").textContent=c.capital.toFixed(2);let r=document.createElement("div");r.textContent=String(e.seq).padStart(3,"0")+" "+e.type+" "+JSON.stringify(e.payload);log.prepend(r);if(e.type==="QUESTION"){bubble.textContent=e.payload.text;$("answerbox").hidden=false;actor.textContent="◉"}if(e.type==="DAMIEN_ASSERTION"){bubble.textContent="Founder assertion received. Decorative until routed.";actor.textContent="◎"}if(e.type==="ACTION"){bubble.textContent="Contacting reality. Please hold.";actor.textContent="◌"}if(e.type==="EXTERNAL_OBSERVATION"){bubble.textContent="CONTACT WITH REALITY.";actor.textContent="⊙";actor.classList.add("flash");setTimeout(()=>actor.classList.remove("flash"),400)}if(e.type==="ARTIFACT"){bubble.textContent="An artifact has escaped the workshop: "+e.payload.name;actor.textContent="▣"}if(e.type==="INTERRUPT"){bubble.textContent="FOUNDER INTERRUPT. Machinery has ceased pretending to be autonomous.";actor.textContent="×";$("answerbox").hidden=true;$("ignite").disabled=true}}const c=new Contact(render);$("ignite").onclick=()=>{$("ignite").disabled=true;c.ignite()};$("send").onclick=()=>{let v=$("answer").value.trim();if(v){$("answerbox").hidden=true;$("answer").value="";c.answer(v)}};$("stop").onclick=()=>c.interrupt();$("export").onclick=()=>{let b=new Blob([c.export()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="contact-event-stream.json";a.click()};</script></body></html>
